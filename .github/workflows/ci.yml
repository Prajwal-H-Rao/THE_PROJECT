# The single CI workflow. It runs the layout checks, the lint and the typecheck.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.23.4"

      - name: Install the tools
        run: python -m pip install --disable-pip-version-check ruff==0.17.1 mypy==2.4.0

      - name: Run the layout checks
        run: |
          python nova/tests/layout/check_layout.py
          python nova/tests/layout/test_layout_checks.py

      - name: Lint the Python code
        run: ruff check .

      - name: Typecheck the Python code
        run: mypy nova

      - name: Test the Python service template
        run: |
          python -m pip install --disable-pip-version-check -r nova/services/_template/python/requirements.txt -r nova/services/_template/python/requirements-dev.txt
          cd nova/services/_template/python && python -m compileall -q app && python -m pytest -q

      - name: Build and test the TypeScript service template
        run: |
          cd nova/services/_template/typescript
          npm ci
          npm run build
          npm test

      - name: Prove that the typecheck fails on a type error
        run: |
          proof=nova/tests/layout/type_error_proof.py
          printf 'def proof():\n    total: int = "twelve"\n    return total\n' > "$proof"
          set +e
          output=$(mypy nova 2>&1)
          status=$?
          set -e
          rm -f "$proof"
          if [ "$status" -ne 1 ]; then
            echo "the typecheck exit code was $status, not 1"
            echo "$output"
            exit 1
          fi
          case "$output" in
            *type_error_proof.py*) ;;
            *)
              echo "the typecheck did not name the type error"
              echo "$output"
              exit 1
              ;;
          esac

      - name: Build the shared contracts before the gateway step reads them
        run: |
          cd nova/packages/contracts
          npm ci
          npm test

      - name: Build and test the api-gateway
        run: |
          cd nova/services/api-gateway
          npm ci
          npm run build
          npm run build:test
          npm test

      - name: Test the database and object isolation suites
        run: |
          cp nova/infra/compose/.env.example nova/infra/compose/.env
          chmod 600 nova/infra/compose/.env
          compose="docker compose -f nova/infra/compose/compose.yaml -f nova/infra/compose/compose.platform.yaml --profile test"
          $compose down -v --remove-orphans
          status=0
          $compose run --rm --build object-init || status=$?
          $compose run --rm --build tests || status=$?
          $compose down -v --remove-orphans
          rm -f nova/infra/compose/.env
          exit $status

      - name: Test that the queue job survives the broker restart
        run: |
          cp nova/infra/compose/.env.example nova/infra/compose/.env
          chmod 600 nova/infra/compose/.env
          compose="docker compose -f nova/infra/compose/compose.yaml -f nova/infra/compose/compose.platform.yaml --profile test"
          $compose down -v --remove-orphans
          status=0
          record=$($compose run --rm --build queue-runner node queues/enqueue.mjs 2>/dev/null | grep '^ENQUEUE ') || status=$?
          job=$(printf '%s\n' "$record" | grep -o 'job=[^ ]*' | head -1 | cut -d= -f2)
          payload=$(printf '%s\n' "$record" | grep -o 'payload=[^ ]*' | cut -d= -f2)
          if [ -z "$job" ] || [ -z "$payload" ]; then
            echo "the enqueue record is incomplete: $record"
            exit 1
          fi
          $compose restart redis || status=$?
          proof=$($compose run --rm queue-runner node queues/verify.mjs "$job" "$payload" 2>/dev/null | grep '^VERIFY ') || status=$?
          case "$proof" in
            *outcome=payload_intact*) ;;
            *)
              echo "the job did not survive the broker restart: $proof"
              exit 1
              ;;
          esac
          $compose down -v --remove-orphans
          rm -f nova/infra/compose/.env
          exit $status

      - name: Test the default-deny network rule
        run: |
          cp nova/infra/compose/.env.example nova/infra/compose/.env
          chmod 600 nova/infra/compose/.env
          compose="docker compose -f nova/infra/compose/compose.yaml -f nova/infra/compose/compose.platform.yaml --profile guard"
          $compose down -v --remove-orphans
          status=0
          # WHY: the allow run first. It holds the healthy dependency of Postgres, so the
          # deny run that follows sees a listening target and proves the rule, not dead time.
          allow=$($compose run --rm --build probe-allow 2>/dev/null | grep '^PROBE ') || status=$?
          case "$allow" in
            *"target=postgres port=5432 mode=allow outcome=connected"*) ;;
            *)
              echo "the allow probe did not connect: $allow"
              exit 1
              ;;
          esac
          deny=$($compose run --rm --build probe-deny 2>/dev/null | grep '^PROBE ') || status=$?
          case "$deny" in
            *"target=postgres port=5432 mode=deny outcome=blocked kind="*) ;;
            *)
              echo "the deny probe record is wrong: $deny"
              exit 1
              ;;
          esac
          echo "$allow"
          echo "$deny"
          $compose down -v --remove-orphans
          rm -f nova/infra/compose/.env
          exit $status
