# The single CI workflow. It runs the layout checks, the lint and the typecheck.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.23.4"

      - name: Install the tools
        run: python -m pip install --disable-pip-version-check ruff==0.17.1 mypy==2.4.0

      - name: Run the layout checks
        run: |
          python nova/tests/layout/check_layout.py
          python nova/tests/layout/test_layout_checks.py

      - name: Lint the Python code
        run: ruff check .

      - name: Typecheck the Python code
        run: mypy nova

      - name: Test the Python service template
        run: |
          python -m pip install --disable-pip-version-check -r nova/services/_template/python/requirements.txt -r nova/services/_template/python/requirements-dev.txt
          cd nova/services/_template/python && python -m compileall -q app && python -m pytest -q

      - name: Build and test the TypeScript service template
        run: |
          cd nova/services/_template/typescript
          npm ci
          npm run build
          npm test

      - name: Prove that the typecheck fails on a type error
        run: |
          proof=nova/tests/layout/type_error_proof.py
          printf 'def proof():\n    total: int = "twelve"\n    return total\n' > "$proof"
          set +e
          output=$(mypy nova 2>&1)
          status=$?
          set -e
          rm -f "$proof"
          if [ "$status" -ne 1 ]; then
            echo "the typecheck exit code was $status, not 1"
            echo "$output"
            exit 1
          fi
          case "$output" in
            *type_error_proof.py*) ;;
            *)
              echo "the typecheck did not name the type error"
              echo "$output"
              exit 1
              ;;
          esac

      - name: Build the shared contracts before the gateway step reads them
        run: |
          cd nova/packages/contracts
          npm ci
          npm test

      - name: Build and test the api-gateway
        run: |
          cd nova/services/api-gateway
          npm ci
          npm run build
          npm run build:test
          npm test

      - name: Test the image runs non-root and holds no secret
        run: |
          docker buildx build --load -t nova/image-proof \
            --build-context contracts=nova/packages/contracts \
            -f nova/services/api-gateway/Dockerfile nova/services/api-gateway
          user=$(docker image inspect --format '{{.Config.User}}' nova/image-proof)
          case "$user" in
            "" | "0" | "0:0" | "root")
              echo "the image runs as the invalid user $user"
              exit 1
              ;;
          esac
          echo "test_images_run_non_root: Config.User=$user"
          # WHY: the value prefixes of nova/infra/compose/.env.example name every
          # local secret value. The env names sit in code by design, so the scan
          # asserts the values only. The cap skips binary addon blobs.
          docker run --rm --network none nova/image-proof node -e '
            const fs = require("fs");
            const cap = 2000000;
            const bad = ["nova-local-", "nova-store-", "BEGIN PRIVATE KEY"];
            const found = [];
            function walk(dir) {
              for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
                const path = dir + "/" + entry.name;
                if (entry.isDirectory()) walk(path);
                else if (fs.statSync(path).size < cap) found.push(path);
              }
            }
            walk("/app");
            let hit = false;
            for (const path of found) {
              for (const needle of bad) {
                if (fs.readFileSync(path, "utf8").includes(needle)) {
                  console.log("SECRET " + needle + " in " + path);
                  hit = true;
                }
              }
            }
            if (!hit) {
              console.log("the image holds no secret");
            } else {
              process.exit(1);
            }
          '

      - name: Test the HTTPS edge
        run: |
          cp nova/infra/compose/.env.example nova/infra/compose/.env
          chmod 600 nova/infra/compose/.env
          compose="docker compose -f nova/infra/compose/compose.yaml -f nova/infra/compose/compose.platform.yaml --profile edge"
          $compose down -v --remove-orphans
          $compose up -d --build --wait edge api-gateway
          # Extract the Caddy root CA from the data volume.
          CA=$(docker run --rm -v $(docker volume ls -qf name=caddy-data):/data alpine:3.21 cat /data/caddy/pki/authorities/local/root.crt 2>/dev/null)
          if [ -z "$CA" ]; then
            echo "failed to extract Caddy root CA"
            $compose down -v --remove-orphans
            rm -f nova/infra/compose/.env
            exit 1
          fi
          echo "$CA" > /tmp/caddy-root-ca.pem
          # HTTPS request with the Caddy CA and host resolve.
          curl -fsS --cacert /tmp/caddy-root-ca.pem --resolve nova-gateway.test:443:127.0.0.1 https://nova-gateway.test/health/live | grep -q '"status":"live"'
          # Plain HTTP on port 80 (unpublished) must be refused.
          set +e
          curl -fsS --max-time 5 --resolve nova-gateway.test:80:127.0.0.1 http://nova-gateway.test/health/live >/dev/null 2>&1
          http_status=$?
          set -e
          if [ $http_status -eq 0 ]; then
            echo "plain HTTP answered, expected refusal"
            $compose down -v --remove-orphans
            rm -f nova/infra/compose/.env
            exit 1
          fi
          $compose down -v --remove-orphans
          rm -f nova/infra/compose/.env

      - name: Test the database and object isolation suites
        run: |
          cp nova/infra/compose/.env.example nova/infra/compose/.env
          chmod 600 nova/infra/compose/.env
          compose="docker compose -f nova/infra/compose/compose.yaml -f nova/infra/compose/compose.platform.yaml --profile test"
          $compose down -v --remove-orphans
          status=0
          $compose run --rm --build object-init || status=$?
          $compose run --rm --build tests || status=$?
          $compose down -v --remove-orphans
          rm -f nova/infra/compose/.env
          exit $status

      - name: Test that the queue job survives the broker restart
        run: |
          cp nova/infra/compose/.env.example nova/infra/compose/.env
          chmod 600 nova/infra/compose/.env
          compose="docker compose -f nova/infra/compose/compose.yaml -f nova/infra/compose/compose.platform.yaml --profile test"
          $compose down -v --remove-orphans
          status=0
          record=$($compose run --rm --build queue-runner node queues/enqueue.mjs 2>/dev/null | grep '^ENQUEUE ') || status=$?
          job=$(printf '%s\n' "$record" | grep -o 'job=[^ ]*' | head -1 | cut -d= -f2)
          payload=$(printf '%s\n' "$record" | grep -o 'payload=[^ ]*' | cut -d= -f2)
          enqueue_trace=$(printf '%s\n' "$record" | grep -o 'trace=[^ ]*' | head -1 | cut -d= -f2)
          if [ -z "$job" ] || [ -z "$payload" ]; then
            echo "the enqueue record is incomplete: $record"
            exit 1
          fi
          $compose restart redis || status=$?
          proof=$($compose run --rm queue-runner node queues/verify.mjs "$job" "$payload" 2>/dev/null | grep '^VERIFY ') || status=$?
          case "$proof" in
            *outcome=payload_intact*) ;;
            *)
              echo "the job did not survive the broker restart: $proof"
              exit 1
              ;;
          esac
          verify_trace=$(printf '%s\n' "$proof" | grep -o 'trace=[^ ]*' | head -1 | cut -d= -f2)
          if [ -z "$enqueue_trace" ] || [ -z "$verify_trace" ] || [ "$enqueue_trace" != "$verify_trace" ]; then
            echo "the trace did not span the broker restart: $enqueue_trace $verify_trace"
            exit 1
          fi
          $compose down -v --remove-orphans
          rm -f nova/infra/compose/.env
          exit $status

      - name: Test the default-deny network rule
        run: |
          cp nova/infra/compose/.env.example nova/infra/compose/.env
          chmod 600 nova/infra/compose/.env
          compose="docker compose -f nova/infra/compose/compose.yaml -f nova/infra/compose/compose.platform.yaml --profile guard"
          $compose down -v --remove-orphans
          status=0
          # WHY: the allow run first. It holds the healthy dependency of Postgres, so the
          # deny run that follows sees a listening target and proves the rule, not dead time.
          allow=$($compose run --rm --build probe-allow 2>/dev/null | grep '^PROBE ') || status=$?
          case "$allow" in
            *"target=postgres port=5432 mode=allow outcome=connected"*) ;;
            *)
              echo "the allow probe did not connect: $allow"
              exit 1
              ;;
          esac
          deny=$($compose run --rm --build probe-deny 2>/dev/null | grep '^PROBE ') || status=$?
          case "$deny" in
            *"target=postgres port=5432 mode=deny outcome=blocked kind="*) ;;
            *)
              echo "the deny probe record is wrong: $deny"
              exit 1
              ;;
          esac
          echo "$allow"
          echo "$deny"
          $compose down -v --remove-orphans
          rm -f nova/infra/compose/.env
          exit $status

      - name: Test backup and restore drill
        run: |
          cp nova/infra/compose/.env.example nova/infra/compose/.env
          chmod 600 nova/infra/compose/.env
          compose="docker compose -f nova/infra/compose/compose.yaml -f nova/infra/compose/compose.platform.yaml --profile test"
          $compose down -v --remove-orphans
          $compose up -d --build --wait postgres
          $compose exec -T postgres pg_isready -U nova -d nova
          # Run the backup drill script
          NOVA_BACKUP_AGE_PUBKEY="" NOVA_BACKUP_AGE_PRIVKEY="" \
          $compose run --rm --workdir /app nova/infra/scripts/backup-drill.sh
          $compose down -v --remove-orphans
          rm -f nova/infra/compose/.env