# CI workflow for NOVA labs.
# Runs only labs with status=implemented. Fails if an implemented lab has no runner.

name: Labs

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lab-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.23.4"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Load lab registry
        id: registry
        run: |
          # Parse registry.yaml for implemented labs
          python3 -c "
import yaml, sys, json
with open('labs/registry.yaml') as f:
    data = yaml.safe_load(f)
implemented = [lab for lab in data['labs'] if lab['status'] == 'implemented']
print('implemented_labs=' + json.dumps(implemented))
print('count=' + str(len(implemented)))
" >> "$GITHUB_OUTPUT"

      - name: Verify implemented labs have test commands
        if: ${{ fromJson(steps.registry.outputs.implemented_labs) != '[]' }}
        run: |
          python3 -c "
import json, sys
labs = json.loads('${{ steps.registry.outputs.implemented_labs }}')
for lab in labs:
    if not lab.get('test_command'):
        print(f'FAIL: Lab {lab["number"]} ({lab["name"]}) has status=implemented but no test_command')
        sys.exit(1)
    print(f'OK: Lab {lab["number"]} has test command: {lab["test_command"]}')
"

      - name: Install dependencies for Lab 1
        if: ${{ fromJson(steps.registry.outputs.count) > 0 }}
        run: |
          # Lab 1 has its own package.json with ajv dependency
          cd labs/lab01 && npm ci

      - name: Run Lab 1 - Contracts OpenAPI Fixture Validation
        if: ${{ fromJson(steps.registry.outputs.count) > 0 }}
        run: |
          node labs/lab01/validate-openapi.js

      - name: Install dependencies for Lab 2
        if: ${{ fromJson(steps.registry.outputs.count) > 1 }}
        run: |
          # Lab 2 is a Python lab
          cd labs/lab02 && pip install -r requirements.txt 2>/dev/null || pip install requests

      - name: Run Lab 2 - Document Parser Evidence-Linked Profile
        if: ${{ fromJson(steps.registry.outputs.count) > 1 }}
        run: |
          cd labs/lab02 && python run_lab.py

      - name: Install dependencies for Lab 3
        if: ${{ fromJson(steps.registry.outputs.count) > 2 }}
        run: |
          # Lab 3 is a Python lab
          cd labs/lab03 && pip install -r requirements.txt 2>/dev/null || pip install requests

      - name: Run Lab 3 - Parser Authenticated Internal Endpoint
        if: ${{ fromJson(steps.registry.outputs.count) > 2 }}
        run: |
          cd labs/lab03 && python run_lab.py

      - name: Fail if no implemented labs found
        if: ${{ steps.registry.outputs.count == '0' }}
        run: |
          echo "No implemented labs found in registry. This is expected for P1 if Lab 1 is not yet implemented."
          # Don't fail - just warn