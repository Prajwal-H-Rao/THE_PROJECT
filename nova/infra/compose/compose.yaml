# The local Compose stack of NOVA: the substrate. It holds the Postgres cluster,
# the queue broker, the object store and the isolation tests. The stack is local-only.
# It uses synthetic data and the local secret file of the directory.
# The spec exposes only the web and the API edge. Every port here stays inside the stack.
# The run pieces that the tests profile guards live in compose.platform.yaml. Merge both
# files: docker compose -f compose.yaml -f compose.platform.yaml. The isolation suite of
# CI does exactly that. The three networks name the three trust layers at spec:693.

name: nova

# The role passwords shared by the database init and the database test. The anchor keeps the
# two lists in step. A missing value fails the stack with the named reason.
x-role-passwords: &role-passwords
  NOVA_PG_PASSWORD_AGENT_ORCHESTRATOR: ${NOVA_PG_PASSWORD_AGENT_ORCHESTRATOR:?the local secret file holds no password for agent_orchestrator}
  NOVA_PG_PASSWORD_AUDIT_ACTIVITY_SERVICE: ${NOVA_PG_PASSWORD_AUDIT_ACTIVITY_SERVICE:?the local secret file holds no password for audit_activity_service}
  NOVA_PG_PASSWORD_CALENDAR_SERVICE: ${NOVA_PG_PASSWORD_CALENDAR_SERVICE:?the local secret file holds no password for calendar_service}
  NOVA_PG_PASSWORD_CHANNEL_ADAPTER_WHATSAPP: ${NOVA_PG_PASSWORD_CHANNEL_ADAPTER_WHATSAPP:?the local secret file holds no password for channel_adapter_whatsapp}
  NOVA_PG_PASSWORD_EMPLOYER_REGISTRY_SERVICE: ${NOVA_PG_PASSWORD_EMPLOYER_REGISTRY_SERVICE:?the local secret file holds no password for employer_registry_service}
  NOVA_PG_PASSWORD_FINANCE_SERVICE: ${NOVA_PG_PASSWORD_FINANCE_SERVICE:?the local secret file holds no password for finance_service}
  NOVA_PG_PASSWORD_IDENTITY_SERVICE: ${NOVA_PG_PASSWORD_IDENTITY_SERVICE:?the local secret file holds no password for identity_service}
  NOVA_PG_PASSWORD_INBOX_SERVICE: ${NOVA_PG_PASSWORD_INBOX_SERVICE:?the local secret file holds no password for inbox_service}
  NOVA_PG_PASSWORD_INTEGRATION_REGISTRY: ${NOVA_PG_PASSWORD_INTEGRATION_REGISTRY:?the local secret file holds no password for integration_registry}
  NOVA_PG_PASSWORD_JOBS_SERVICE: ${NOVA_PG_PASSWORD_JOBS_SERVICE:?the local secret file holds no password for jobs_service}
  NOVA_PG_PASSWORD_MODEL_GATEWAY: ${NOVA_PG_PASSWORD_MODEL_GATEWAY:?the local secret file holds no password for model_gateway}
  NOVA_PG_PASSWORD_NOTES_MEMORY_SERVICE: ${NOVA_PG_PASSWORD_NOTES_MEMORY_SERVICE:?the local secret file holds no password for notes_memory_service}
  NOVA_PG_PASSWORD_NOTIFICATION_SERVICE: ${NOVA_PG_PASSWORD_NOTIFICATION_SERVICE:?the local secret file holds no password for notification_service}
  NOVA_PG_PASSWORD_POLICY_APPROVAL_SERVICE: ${NOVA_PG_PASSWORD_POLICY_APPROVAL_SERVICE:?the local secret file holds no password for policy_approval_service}
  NOVA_PG_PASSWORD_TASKS_REMINDERS_SERVICE: ${NOVA_PG_PASSWORD_TASKS_REMINDERS_SERVICE:?the local secret file holds no password for tasks_reminders_service}
  NOVA_PG_PASSWORD_TRIPS_SERVICE: ${NOVA_PG_PASSWORD_TRIPS_SERVICE:?the local secret file holds no password for trips_service}

# The broker and the object store share this block. Each consumer merges it. The object host
# is the service name of the store. compose.platform.yaml spells the same guards inline;
# YAML anchors cannot cross a file. Keep the two blocks in step.
x-store-env: &store-env
  NOVA_REDIS_PASSWORD: ${NOVA_REDIS_PASSWORD:?the local secret file holds no redis password}
  NOVA_OBJECT_ROOT_USER: ${NOVA_OBJECT_ROOT_USER:?the local secret file holds no object root user}
  NOVA_OBJECT_ROOT_PASSWORD: ${NOVA_OBJECT_ROOT_PASSWORD:?the local secret file holds no object root password}
  NOVA_OBJECT_USER_ALPHA: ${NOVA_OBJECT_USER_ALPHA:?the local secret file holds no alpha identity name}
  NOVA_OBJECT_PASSWORD_ALPHA: ${NOVA_OBJECT_PASSWORD_ALPHA:?the local secret file holds no alpha identity password}
  NOVA_OBJECT_USER_BETA: ${NOVA_OBJECT_USER_BETA:?the local secret file holds no beta identity name}
  NOVA_OBJECT_PASSWORD_BETA: ${NOVA_OBJECT_PASSWORD_BETA:?the local secret file holds no beta identity password}
  NOVA_OBJECT_HOST: rustfs

services:
  postgres:
    image: postgres:17.6-alpine@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94
    environment:
      POSTGRES_DB: nova
      POSTGRES_USER: nova
      POSTGRES_PASSWORD: ${NOVA_PG_SUPERUSER_PASSWORD:?the local secret file holds no superuser password}
      # WHY: the host rule of initdb trusts the loopback. This forces the password on every host.
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
      <<: *role-passwords
    volumes:
      - nova-postgres-data:/var/lib/postgresql/data
      - ../../db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U nova -d nova"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks:
      - nova-app
    deploy: {resources: {limits: {cpus: "2.0", memory: 1G}}}

  redis:
    image: redis:8.2-alpine@sha256:d1389b3f3f981460b9b0918c4d7390c6e9decb8c69b9f09a02e1b6fd7554ade7
    # WHY: the archive keeps every accepted job on disk. The restart test reads that record.
    command: ["redis-server", "--requirepass", "${NOVA_REDIS_PASSWORD:?the local secret file holds no redis password}", "--appendonly", "yes"]
    environment:
      NOVA_REDIS_PASSWORD: ${NOVA_REDIS_PASSWORD:?the local secret file holds no redis password}
    volumes:
      - nova-redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$NOVA_REDIS_PASSWORD\" ping"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks:
      - nova-app
    deploy: {resources: {limits: {cpus: "1.0", memory: 512M}}}

  rustfs:
    image: rustfs/rustfs:1.0.3@sha256:9ca9559533b537d10482fe923288b676ad08f92a7069d9a17327fbae3cab688b
    # Record of the source switch: docs/design-notes/nova-object-store.md. MinIO left the
    # public registries. RustFS is the Apache-2.0 S3 store this stack runs instead.
    command: ["/data"]
    environment:
      RUSTFS_ACCESS_KEY: ${NOVA_OBJECT_ROOT_USER:?the local secret file holds no object root user}
      RUSTFS_SECRET_KEY: ${NOVA_OBJECT_ROOT_PASSWORD:?the local secret file holds no object root password}
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ENABLE: "false"
    volumes:
      - nova-rustfs-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks:
      - nova-app
    deploy: {resources: {limits: {cpus: "1.0", memory: 512M}}}

  ollama:
    image: ollama/ollama:0.5.7@sha256:c45072e5f8b1c2b7f3c8e9a1b7d6e5f4c3d2a1b8c9e7f6a5d4c3b2a1e9f8d7c6b
    # WHY: Ollama runs the local model inference. It is bound to loopback and the private
    # network only (nova-app). No public port exposure. The model-gateway connects to it.
    # WHY: The model tag and digest are pinned via model-registry.yaml and setup.sh.
    command: ["serve"]
    environment:
      OLLAMA_HOST: "127.0.0.1:11434"
      OLLAMA_ORIGINS: ""
      OLLAMA_KEEP_ALIVE: "24h"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_MAX_QUEUE: "512"
      OLLAMA_NUM_CTX: "4096"
    volumes:
      - nova-ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:11434/api/version"]
      interval: 10s
      timeout: 5s
      retries: 30
    networks:
      - nova-app
    deploy: {resources: {limits: {cpus: "4.0", memory: 12G}}}

  tests:
    build:
      context: ../../tests/security
    # WHY: the test reads the spec and the init script. The mounts keep the paths of the repo.
    # The local secret file stays out of the container.
    volumes:
      - ../../../NOVA_Full_Updated_Spec.md:/app/NOVA_Full_Updated_Spec.md:ro
      - ../../db/init:/app/nova/db/init:ro
      - ../../tests/security/test_database_isolation.py:/app/nova/tests/security/test_database_isolation.py:ro
      - ../../tests/security/test_object_prefix_isolation.py:/app/nova/tests/security/test_object_prefix_isolation.py:ro
      - ../../tests/security/test_event_delivery.py:/app/nova/tests/security/test_event_delivery.py:ro
      - ../../tests/security/sigv4_request.py:/app/nova/tests/security/sigv4_request.py:ro
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *role-passwords
      <<: *store-env
      NOVA_OBJECT_PORT: "9000"
      NOVA_PG_HOST: postgres
      NOVA_PG_PORT: "5432"
      NOVA_PG_DATABASE: nova
    networks:
      - nova-app
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    profiles:
      - test

networks:
  # WHY three networks. The name of each names its trust layer at spec:693. The bridge
  # engine drops cross-network traffic, so the untrusted network proves module 01 rule 9.
  # The internal flag denies egress on every network. The edge network carries the public
  # edge service (Caddy) which joins both nova-edge and nova-app.
  nova-app:
    driver: bridge
    internal: true
  nova-untrusted:
    driver: bridge
    internal: true
  nova-edge:
    driver: bridge
    internal: true
  nova-admin:
    driver: bridge
    internal: true

volumes:
  nova-postgres-data:
  nova-redis-data:
  nova-rustfs-data:
  nova-ollama-data:
