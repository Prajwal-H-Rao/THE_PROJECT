apiVersion: v1
kind: ResourceQuota
metadata:
  name: nova-resource-quota
  namespace: nova
spec:
  hard:
    requests.cpu: "4"
    requests.memory: "8Gi"
    requests.storage: "100Gi"
    limits.cpu: "8"
    limits.memory: "16Gi"
    limits.storage: "200Gi"
    requests.nvidia.com/gpu: "0"
    limits.nvidia.com/gpu: "0"
    count/pods: "50"
    count/services: "20"
    count/secrets: "100"
    count/configmaps: "50"
    count/persistentvolumeclaims: "50"

---
apiVersion: v1
kind: LimitRange
metadata:
  name: nova-limit-range
  namespace: nova
spec:
  limits:
  - default:
      cpu: "500m"
      memory: "512Mi"
    defaultRequest:
      cpu: "100m"
      memory: "128Mi"
    type: Container
  - default:
      cpu: "2"
      memory: "4Gi"
    defaultRequest:
      cpu: "500m"
      memory: "1Gi"
    type: Container
    containerName: ml-service
  - default:
      cpu: "1"
      memory: "2Gi"
    defaultRequest:
      cpu: "200m"
      memory: "512Mi"
    type: Container
    containerName: document-service
