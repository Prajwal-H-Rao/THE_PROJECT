# Nova Model Registry
# Path: spec:961 - models/model-registry.yaml
# This file is the single source of truth for model configuration.
# The model gateway (P5) and the router (P5) both read this file.

# Model rows: each row describes one runnable model variant.
# Fields: id, provider, tags, digest, status, quant, licence, num_ctx, router_role
# router_role: "classifier_only" | "planner" - used by the router to enforce tier rules
# status: "pinned" | "pending_pin" - pinned means digest is verified; pending_pin means not yet pulled/verified
