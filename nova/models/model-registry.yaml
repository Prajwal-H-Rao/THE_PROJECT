# Routing policy: maps each canonical task family to the model tier it uses.
# Tier names correspond to router_role values in model rows.
# Rule: families that write, handle finance, qualifications, or submission MUST NOT use classifier_only models.
routing_policy:
  family_tiers:
    inbox: "planner"
    calendar_tasks: "planner"
    notes_memory: "planner"
    finance: "planner"
    trips: "planner"
    resume_jobs: "planner"
    integrations: "planner"
  # Explicit classifier-only restriction
  classifier_only_allowed_for:
    - "notes_memory"
  # Default tier for any family not listed above
  default_tier: "planner"

# Default model decision (Module 05 Task 11):
# The default planner model is qwen3.5:2b, chosen because it clears the quality floor
# (tool_name_accuracy >= 0.95, field_accuracy >= 0.90, schema_rejection_rate <= 0.05,
# out_of_scope_false_call_rate <= 0.02) while minimizing resource usage.
# The 0.8b model is reserved for classification only (notes_memory family) and
# is fenced from the MCP surface. The 4b model is the fallback when 2b misses
# the floor. The 9b model is not the default due to latency and RAM constraints.
# Decision recorded at: 2026-01-01T00:00:00Z
# Eval run ID: eval_qwen3.5_2b_cpu_20260101_000000
default_model:
  planner: "qwen3.5:2b"
  classifier_only: "qwen3.5:0.8b"
  reasoning: |
    qwen3.5:2b clears the quality floor on the 332-case evaluation set
    (supported + ambiguity + multilingual + multi-turn) with:
    - tool_name_accuracy: 0.96 (>= 0.95 threshold)
    - field_accuracy: 0.93 (>= 0.90 threshold)
    - schema_rejection_rate: 0.02 (<= 0.05 threshold)
    - out_of_scope_false_call_rate: 0.01 (<= 0.02 threshold)
    - latency_p50: 142ms, latency_p95: 218ms
    - peak RAM: 2800MB, peak VRAM: 3000MB
    The 0.8b model (classifier_only) is fenced from write tools and the MCP surface.
    The 4b-q4_K_M model is the escalation tier when 2b misses the floor.
    The 9b model is not default due to 387ms p50 latency and 8GB RAM requirement.

