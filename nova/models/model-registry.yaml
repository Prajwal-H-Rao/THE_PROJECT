# Routing policy: maps each canonical task family to the model tier it uses.
# Tier names correspond to router_role values in model rows.
# Rule: families that write, handle finance, qualifications, or submission MUST NOT use classifier_only models.
routing_policy:
  family_tiers:
    inbox: "planner"
    calendar: "planner"
    tasks: "planner"
    finance: "planner"
    trips: "planner"
    resume_jobs: "planner"
    integrations: "planner"
  # Explicit classifier-only restriction
  classifier_only_allowed_for:
    - "notes_memory"
  # Default tier for any family not listed above
  default_tier: "planner"

# CI fake model row (used by module 05 task 14 and module 03 task 15)
# This row exists only for CI; the gateway loads it when NOVA_ENV=test
fake_model:
  id: "nova-fake-model"
  provider: "fake"
  tags: ["test"]
  digest: "fake-digest-for-ci"
  status: "pinned"
  quant: "N/A"
  licence: "NOVA-internal"
  num_ctx: 4096
  router_role: "planner"
  ci_only: true